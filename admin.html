
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1424">
  <title>Bosnia Explorer — Administracija</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b1424;
      color: #f5f0e5;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2 { color: #e4bd70; }

    input, textarea, button {
      width: 100%;
      margin: 7px 0;
      padding: 12px;
      border-radius: 7px;
      border: 1px solid #526078;
      font: inherit;
    }

    input, textarea {
      background: #17243a;
      color: white;
    }

    button {
      background: #d8b36b;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #34435b;
      border-radius: 12px;
      background: #111e32;
    }

    .hidden { display: none !important; }

    .item {
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #34435b;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .muted { color: #c0cad8; }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 12px;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
<main>
  <h1>Bosnia Explorer</h1>
  <p class="muted">Administratorski panel</p>

  <section id="login">
    <h2>Prijava administratora</h2>

    <form id="loginForm">
      <label for="email">Email adresa</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Lozinka</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">
        Prijavi se
      </button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <p id="who"></p>

    <button id="logoutBtn" type="button">
      Odjavi se
    </button>

    <h2>Sadržaj stranice</h2>
    <p class="muted">
      Pregled zapisa iz Supabase tabele site_content.
    </p>

    <button id="refreshBtn" type="button">
      Osvježi sadržaj
    </button>

    <div id="items"></div>
  </section>

  <p id="status" role="status" aria-live="polite">
    Učitavanje administracije...
  </p>
</main>

<script type="module">
const SUPABASE_URL =
  'https://qgdnmiqziogicadhsgkw.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_OkgAf0i8qLu6PLKIydEuJQ_UZ_ajCpR';

const $ = (id) => document.getElementById(id);

function setStatus(message) {
  $('status').textContent = message;
}

function showLogin() {
  $('login').classList.remove('hidden');
  $('dashboard').classList.add('hidden');
}

function showDashboard() {
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
}

async function startApp() {
  let createClient;

  try {
    const module = await import(
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    );
    createClient = module.createClient;
  } catch (error) {
    setStatus(
      'Supabase biblioteka se nije učitala. Provjeri internet ' +
      'vezu ili pokušaj ponovo. Detalji: ' + error.message
    );
    return;
  }

  if (
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY === 'ZALIJEPI_SVOJ_PUBLISHABLE_KEY'
  ) {
    setStatus(
      'Nedostaje Supabase publishable key. Provjeri konfiguraciju.'
    );
    return;
  }

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function loadContent() {
    $('refreshBtn').disabled = true;
    $('items').replaceChildren();
    setStatus('Učitavanje sadržaja...');

    try {
      const { data, error } = await supabase
        .from('site_content')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        setStatus(
          'Greška pri učitavanju sadržaja: ' + error.message
        );
        return;
      }

      if (!data || data.length === 0) {
        $('items').textContent =
          'Tabela je prazna. Još nema objavljenih zapisa.';
      } else {
        for (const record of data) {
          const card = document.createElement('article');
          card.className = 'item';

          const title = document.createElement('h3');
          title.textContent = record.title || 'Bez naslova';

          const details = document.createElement('pre');
          details.textContent = JSON.stringify(record, null, 2);

          card.append(title, details);
          $('items').append(card);
        }
      }

      setStatus('Sadržaj je učitan.');
    } catch (error) {
      setStatus('Greška: ' + error.message);
    } finally {
      $('refreshBtn').disabled = false;
    }
  }

  async function showAdmin(user) {
    setStatus('Provjera administratorskih prava...');

    try {
      const { data: admin, error } = await supabase
        .from('admin_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (error) {
        showLogin();
        setStatus(
          'Prijava je uspjela, ali provjera administratora nije. ' +
          error.message
        );
        return;
      }

      if (!admin) {
        await supabase.auth.signOut();
        showLogin();
        setStatus(
          'Korisnik je prijavljen, ali nije registrovan kao ' +
          'administrator u tabeli admin_users.'
        );
        return;
      }

      $('who').textContent = 'Prijavljen: ' + (user.email || '');
      showDashboard();
      await loadContent();
    } catch (error) {
      showLogin();
      setStatus('Greška pri provjeri administratora: ' + error.message);
    }
  }

  $('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    const button = $('loginBtn');
    button.disabled = true;
    setStatus('Prijavljivanje...');

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });

      if (error) {
        setStatus('Prijava nije uspjela: ' + error.message);
        return;
      }

      await showAdmin(data.user);
    } catch (error) {
      setStatus(
        'Greška pri povezivanju sa Supabaseom: ' + error.message
      );
    } finally {
      button.disabled = false;
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    setStatus('Odjavljivanje...');

    const { error } = await supabase.auth.signOut();

    showLogin();

    if (error) {
      setStatus('Greška pri odjavi: ' + error.message);
    } else {
      setStatus('Uspješno ste se odjavili.');
    }
  });

  $('refreshBtn').addEventListener('click', loadContent);

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      showLogin();
      $('who').textContent = '';
    }
  });

  try {
    const { data, error } = await supabase.auth.getSession();

    if (error) {
      setStatus('Greška pri provjeri sesije: ' + error.message);
      return;
    }

    if (data.session) {
      await showAdmin(data.session.user);
    } else {
      setStatus('Unesi email i lozinku za prijavu.');
    }
  } catch (error) {
    setStatus('Greška pri pokretanju: ' + error.message);
  }
}

startApp();
</script>
</body>
</html>
